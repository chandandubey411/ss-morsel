<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0B3D91"/>

  <!-- Green accent bar at top -->
  <rect x="0" y="0" width="64" height="6" rx="3" fill="#00C389"/>
  <!-- Clip top-right corners of bar to match the rounded rect -->
  <rect x="50" y="0" width="14" height="6" fill="#0B3D91"/>
  <rect x="0" y="0" width="14" height="6" fill="#0B3D91"/>
  <rect x="4" y="0" width="56" height="6" fill="#00C389"/>

  <!-- "SS" text -->
  <text
    x="32"
    y="38"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    font-weight="800"
    fill="white"
    text-anchor="middle"
    letter-spacing="1"
  >SS</text>

  <!-- Green underline accent -->
  <rect x="16" y="44" width="32" height="3" rx="1.5" fill="#00C389"/>
</svg>